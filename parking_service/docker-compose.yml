services:
  postgres:
    image: postgres:15-alpine
    container_name: parking_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parking_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # ВНИМАНИЕ: POSTGRES_PASSWORD обязателен — без него compose упадёт.
      # Не оставляйте пустым и не используйте "postgres" в проде —
      # PostgreSQL superuser умеет COPY TO PROGRAM (RCE через shell).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - set it in .env}
    volumes:
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    # ports НЕТ намеренно: PostgreSQL доступен ТОЛЬКО внутри docker-сети
    # (backend ходит по имени `postgres:5432`). Снаружи 5432 не торчит.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-parking_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    container_name: parking_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/parking_db?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - set it in .env}
      JWT_TTL: ${JWT_TTL:-24h}
      HTTP_ADDR: ":8080"
      PARKING_EXPIRE_AFTER: ${PARKING_EXPIRE_AFTER:-2m}
      SIMULATION_ENABLED: ${SIMULATION_ENABLED:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres_data:
