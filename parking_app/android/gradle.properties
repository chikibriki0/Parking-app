org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Длительные таймауты — без них Google Cloud Storage режется/тротлится
# и скачивание engine-артефактов падает с Read timed out.
org.gradle.internal.http.connectionTimeout=180000
org.gradle.internal.http.socketTimeout=180000

# Кэшируем то, что уже скачали, и параллелим сборку.
org.gradle.caching=true
org.gradle.parallel=true
