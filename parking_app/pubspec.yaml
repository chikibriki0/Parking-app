name: parking_app
description: Мобильное приложение для управления парковочными местами

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.11.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  web_socket_channel: ^2.4.0
  shared_preferences: ^2.2.2
  jwt_decoder: ^2.0.1
  intl: ^0.19.0
  provider: ^6.1.1
  google_fonts: ^6.2.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.0
  geolocator: ^13.0.1
  cached_network_image: ^3.4.1
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true